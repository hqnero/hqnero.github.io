<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARASAKA DATABASE // NETRUNNER DOSSIER</title>
    <style>
        :root {
            --arasaka-red: #ff003c;
            --arasaka-dark-red: #8b0000;
            --cyber-yellow: #fcee0a;
            --cyber-bg: #08090a;
            --cyber-card: #121417;
            --cyber-text: #e2e8f0;
            --cyber-dim: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--cyber-bg);
            color: var(--cyber-text);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: 
                radial-gradient(rgba(255, 0, 60, 0.15) 1px, transparent 0),
                linear-gradient(to bottom, rgba(8, 9, 10, 0.95), rgba(8, 9, 10, 0.98));
            background-size: 24px 24px, 100% 100%;
        }

        /* Сканирующий луч на фоне */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
            opacity: 0.6;
        }

        .dossier-card {
            background: var(--cyber-card);
            border: 2px solid var(--arasaka-red);
            width: 100%;
            max-width: 680px;
            padding: 30px;
            position: relative;
            box-shadow: 0 0 25px rgba(255, 0, 60, 0.25);
            overflow: hidden;
        }

        /* Декоративные углы */
        .dossier-card::before {
            content: "ARASAKA CORP // SECURITY DIVISION";
            position: absolute;
            top: 8px;
            right: 12px;
            font-size: 10px;
            color: var(--arasaka-red);
            letter-spacing: 2px;
            font-weight: bold;
        }

        .header {
            border-bottom: 2px solid var(--arasaka-red);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .logo {
            color: var(--arasaka-red);
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 6px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 0, 60, 0.5);
        }

        .sub-header {
            color: var(--cyber-yellow);
            font-size: 12px;
            letter-spacing: 3px;
            margin-top: 5px;
        }

        .status-badge {
            display: inline-block;
            background: var(--arasaka-red);
            color: #fff;
            font-weight: bold;
            font-size: 11px;
            padding: 3px 8px;
            margin-top: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .section-title {
            color: var(--cyber-yellow);
            font-size: 14px;
            letter-spacing: 2px;
            margin-top: 20px;
            margin-bottom: 10px;
            text-transform: uppercase;
            border-left: 3px solid var(--cyber-yellow);
            padding-left: 8px;
        }

        .bio-info {
            line-height: 1.6;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .bio-info span {
            color: var(--cyber-dim);
        }
